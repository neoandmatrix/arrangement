# Builds the Bandobast Android app and attaches the APK to the run (Actions tab → the run → Artifacts).
#
# Runs on every push that touches app/, or by hand (Actions → Build Android APK → Run workflow).
# Firebase push is optional: add the contents of google-services.json as the repository secret
# GOOGLE_SERVICES_JSON (Settings → Secrets and variables → Actions). Without it the app still builds
# and rings while it's open.
name: Build Android APK

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "release (smaller, faster) or debug (if release misbehaves)"
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        # Accepts the file's contents as plain JSON or base64, and stops with a clear message otherwise.
        run: |
          python3 - <<'PY'
          import base64, json, os, sys
          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw:
              print("Firebase push: off (no GOOGLE_SERVICES_JSON secret)")
              sys.exit(0)
          config = None
          for text in (raw, None):
              try:
                  config = json.loads(text if text is not None else base64.b64decode(raw, validate=False))
                  break
              except Exception:
                  continue
          if not isinstance(config, dict) or "project_info" not in config:
              print("::error::GOOGLE_SERVICES_JSON is not a google-services.json file. Set it with: "
                    "gh secret set GOOGLE_SERVICES_JSON < app/android/app/google-services.json "
                    "(expected plain JSON or base64-encoded JSON)")
              sys.exit(1)
          packages = [c["client_info"]["android_client_info"]["package_name"] for c in config.get("client", [])]
          if "ai.bandobast.app" not in packages:
              print(f"::error::google-services.json is for {packages}, not ai.bandobast.app")
              sys.exit(1)
          with open("android/app/google-services.json", "w") as f:
              json.dump(config, f)
          print(f"Firebase push: on (project {config['project_info']['project_id']})")
          PY

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # One APK per CPU type instead of one universal APK with all three (~94 MB, mostly WebRTC's
      # native library x3). Almost every phone needs app-arm64-v8a-*.apk.
      - name: Build APK
        run: flutter build apk --${{ inputs.build_type || 'release' }} --split-per-abi
      - run: ls -lh build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bandobast-${{ inputs.build_type || 'release' }}-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-*.apk
          retention-days: 14
